<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1012; overflow: hidden; font: 600 12px/1 system-ui, sans-serif; }
  .scene { position: absolute; inset: 0; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 70%, #2a2f33 0%, #121517 70%); }
  .bed { position: absolute; left: 10%; right: 10%; bottom: 12%; height: 22%; border-radius: 6px;
    background: linear-gradient(#3b4146, #24282b); transform: perspective(300px) rotateX(55deg); }
  img { position: relative; width: 46%; max-width: 260px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.6)); animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: translateY(-2px) scale(1.01); } }
  .tag { position: absolute; left: 10px; top: 10px; color: #fff; background: rgba(0,0,0,.45); padding: 5px 8px; border-radius: 999px; }
  .tag i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #E5484D; margin-right: 6px; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { img, .tag i { animation: none; } }
</style>
</head>
<body>
  <div class="scene"><div class="bed"></div><img src="icons/demo/benchy.png" alt=""></div>
  <span class="tag"><i></i>LIVE · demo</span>
</body>
</html>
